name: Release SharedLogic

on:
  push:
    tags: ['*.*.*']

permissions: 
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build XCFramework
        run: ./gradlew :sharedLogic:assembleSharedLogicXCFramework

      - name: Copy framework into repo
        run: |
          rm -rf Frameworks/SharedLogic.xcframework
          mkdir -p Frameworks
          cp -R sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework Frameworks/

      - name: Commit framework and manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Frameworks/SharedLogic.xcframework Package.swift
          git commit -m "Release ${GITHUB_REF_NAME}"
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}" --force
