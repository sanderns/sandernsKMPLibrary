name: Release SharedLogic

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build XCFramework
        run: ./gradlew :sharedLogic:assembleSharedLogicXCFramework

      - name: Zip XCFramework
        run: |
          cd sharedLogic/build/XCFrameworks/release
          zip -r SharedLogic.xcframework.zip SharedLogic.xcframework

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework.zip)
          echo "value=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
            gh release upload "${GITHUB_REF_NAME}" \
              sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework.zip
          fi

      - name: Resolve the API asset URL
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_URL=$(gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[] | select(.name == "SharedLogic.xcframework.zip") | .apiUrl // empty')
          if [ -z "$ASSET_URL" ]; then
            # fallback: build it directly from the REST API if gh's json doesn't expose apiUrl
            ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[] | select(.name=="SharedLogic.xcframework.zip") | .id')
            ASSET_URL="https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
          fi
          echo "url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift
        run: |
          sed -i '' "s#url: \".*\"#url: \"${{ steps.asset.outputs.url }}\"#" Package.swift
          sed -i '' "s#checksum: \".*\"#checksum: \"${{ steps.checksum.outputs.value }}\"#" Package.swift

      - name: Commit and force-move tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Package.swift
          git commit -m "Update Package.swift for ${GITHUB_REF_NAME}"
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}" --force