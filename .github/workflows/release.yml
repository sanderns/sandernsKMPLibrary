name: Release SharedLogic

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # ensures LFS objects are pulled during checkout

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build XCFramework
        run: ./gradlew :sharedLogic:assembleSharedLogicXCFramework

      - name: Copy framework into repo
        run: |
          rm -rf Frameworks/SharedLogic.xcframework
          mkdir -p Frameworks
          cp -R sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework Frameworks/

      - name: Commit framework (via LFS) and manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git lfs install
          git add Frameworks/SharedLogic.xcframework Package.swift .gitattributes
          git commit -m "Release ${GITHUB_REF_NAME}"
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}" --force

      - name: Prune old tags beyond retention window
        run: |
          KEEP=10
          git fetch --tags
          git tag --sort=-v:refname | tail -n +$((KEEP+1)) | while read -r old_tag; do
            echo "Deleting old tag: $old_tag"
            git push origin ":refs/tags/$old_tag" || true
          done