name: Release SharedLogic

on:
  push:
    tags: ['*.*.*']

permissions: 
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build XCFramework
        run: ./gradlew :sharedLogic:assembleSharedLogicXCFramework

      - name: Zip XCFramework
        run: |
          cd sharedLogic/build/XCFrameworks/release
          zip -r SharedLogic.xcframework.zip SharedLogic.xcframework

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework.zip)
          echo "value=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift
        run: |
          VERSION="${GITHUB_REF_NAME}"
          sed -i '' "s#download/[^/]*/SharedLogic.xcframework.zip#download/${VERSION}/SharedLogic.xcframework.zip#" Package.swift
          sed -i '' "s#checksum: \".*\"#checksum: \"${{ steps.checksum.outputs.value }}\"#" Package.swift

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Package.swift
          git commit -m "Update Package.swift for ${GITHUB_REF_NAME}"
          # move the tag to include this commit, so SPM resolves this exact manifest at this exact tag
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}" --force

      - name: Create or update GitHub Release with asset
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              sharedLogic/build/XCFrameworks/release/SharedLogic.xcframework.zip \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
